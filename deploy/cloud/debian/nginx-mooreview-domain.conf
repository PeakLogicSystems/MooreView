# MooreVIEW — nginx for a custom domain (e.g. mooreview.io)
# SaaS (multi-tenant) listens on 3100. Legacy appliance runtime used 3090.
# HTTP first, then: certbot --nginx -d mooreview.io -d www.mooreview.io
#
#   cp nginx-mooreview-domain.conf /etc/nginx/sites-available/mooreview
#   ln -sf /etc/nginx/sites-available/mooreview /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   ufw allow 80/tcp
#   ufw allow 443/tcp
#   certbot --nginx -d mooreview.io -d www.mooreview.io

server {
    listen 80;
    listen [::]:80;
    server_name mooreview.io www.mooreview.io;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
