# Append to /etc/mosquitto/conf.d/mooreview.conf for ESP32 mqtts :8883
# Certs: MOSQUITTO_DOMAIN=<iot-link-hostname> bash deploy/cloud/debian/setup-mosquitto-tls.sh
listener 8883 0.0.0.0
protocol mqtt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
allow_anonymous false
password_file /etc/mosquitto/passwd
