<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#f1f5f9"/>
  <text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#0f172a">Tank 2 — Integrated MLE (125K gal)</text>
  <text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Large center clarifier — narrow outer ring split ½ aerobic / ½ anoxic</text>

  <g transform="translate(310, 410) scale(1.5)" font-family="Segoe UI, Arial, sans-serif">
    <circle cx="0" cy="0" r="118" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
    <path d="M -75,0 A 75,75 0 0,1 75,0 L 115,0 A 115,115 0 0,0 -115,0 Z" fill="#06b6d4" opacity="0.4"/>
    <path d="M -75,0 A 75,75 0 0,0 75,0 L 115,0 A 115,115 0 0,1 -115,0 Z" fill="#6366f1" opacity="0.45"/>
    <circle cx="0" cy="0" r="75" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#475569" stroke-width="1" stroke-dasharray="5,4" opacity="0.65"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" fill="#334155">Clarifier</text>
    <text x="0" y="-78" text-anchor="middle" font-size="11" fill="#0e7490">Aerobic ½ ring</text>
    <text x="0" y="86" text-anchor="middle" font-size="11" fill="#312e81">Anoxic ½ ring</text>

    <circle cx="0" cy="0" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <circle id="lamp_scraper_run" cx="0" cy="0" r="6" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-58" x2="48" y2="-32" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <text x="-52" y="128" font-size="11" fill="#92400e">Clarifier scraper</text>

    <circle cx="-42" cy="92" r="7" fill="#a855f7" stroke="#6b21a8" stroke-width="2"/>
    <line x1="-42" y1="92" x2="-95" y2="98" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="-188" y="58" width="88" height="42" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="-180" y="76" font-size="10" fill="#64748b">ORP</text>
    <text id="val_place_orp" x="-180" y="94" font-size="13" font-weight="600" fill="#0f172a">—</text>

    <circle cx="42" cy="92" r="7" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    <line x1="42" y1="92" x2="88" y2="102" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="92" y="68" width="88" height="42" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="100" y="86" font-size="10" fill="#64748b">DO2 (anoxic)</text>
    <text id="val_place_do2" x="100" y="104" font-size="13" font-weight="600" fill="#0f172a">—</text>

    <circle cx="48" cy="-92" r="7" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
    <line x1="48" y1="-92" x2="108" y2="-98" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="112" y="-88" width="96" height="42" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="120" y="-70" font-size="10" fill="#64748b">DO1 aerobic (DO3500)</text>
    <text id="val_place_do1" x="120" y="-52" font-size="13" font-weight="600" fill="#0891b2">—</text>

    <circle cx="-48" cy="-92" r="7" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <line x1="-48" y1="-92" x2="-108" y2="-98" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="-188" y="-92" width="72" height="42" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="-180" y="-74" font-size="10" fill="#64748b">pH</text>
    <text id="val_place_ph" x="-180" y="-56" font-size="13" font-weight="600" fill="#0f172a">—</text>

    <text x="0" y="148" text-anchor="middle" font-size="13" fill="#334155">125,000 gal circular</text>

    <!-- WAS recirculation pumps (2) -->
    <g transform="translate(-108, 12)">
      <rect x="-16" y="-14" width="32" height="28" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
      <circle id="lamp_was_pump1_run" cx="0" cy="0" r="9" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#475569">WAS 1</text>
    </g>
    <line x1="-92" y1="12" x2="-76" y2="12" stroke="#6f42c1" stroke-width="3" stroke-linecap="round"/>
    <rect x="-168" y="-4" width="72" height="36" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="-160" y="12" font-size="10" fill="#64748b">WAS 1 GPM</text>
    <text id="val_was1_flow" x="-160" y="28" font-size="13" font-weight="600" fill="#6f42c1">—</text>
    <g transform="translate(108, 12)">
      <rect x="-16" y="-14" width="32" height="28" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
      <circle id="lamp_was_pump2_run" cx="0" cy="0" r="9" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#475569">WAS 2</text>
    </g>
    <line x1="76" y1="12" x2="92" y2="12" stroke="#6f42c1" stroke-width="3" stroke-linecap="round"/>
    <rect x="96" y="-4" width="72" height="36" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="104" y="12" font-size="10" fill="#64748b">WAS 2 GPM</text>
    <text id="val_was2_flow" x="104" y="28" font-size="13" font-weight="600" fill="#6f42c1">—</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a">
    <text x="640" y="130" font-size="17" font-weight="600">Process values</text>
    <text x="640" y="162">Level %</text>
    <text id="val_t2_lvl" x="860" y="162" font-weight="600">—</text>
    <text x="640" y="194">DO1 aerobic mg/L</text>
    <text id="val_t2_aer_do" x="860" y="194" font-weight="600" fill="#0891b2">—</text>
    <text x="640" y="226">DO2 anoxic mg/L</text>
    <text id="val_t2_anox_do" x="860" y="226" font-weight="600">—</text>
    <text x="640" y="258">ORP mV</text>
    <text id="val_t2_anox_orp" x="860" y="258" font-weight="600">—</text>
    <text x="640" y="290">pH</text>
    <text id="val_t2_ph" x="860" y="290" font-weight="600">—</text>
    <text x="640" y="322">Aerobic DO SP</text>
    <text id="val_t2_aer_do_sp" x="860" y="322" font-weight="600">—</text>
    <text x="640" y="354">IR flow GPM</text>
    <text id="val_t2_ir_flow" x="860" y="354" font-weight="600">—</text>
    <text x="640" y="386">NH₃ mg/L</text>
    <text id="val_t2_nh3" x="860" y="386" font-weight="600">—</text>
    <circle id="lamp_scraper_alm" cx="652" cy="418" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="672" y="423" font-size="14">Scraper alarm</text>
  </g>

  <!-- WAS recirc pumps -->
  <g transform="translate(640, 448)" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#0f172a">WAS recirc pumps</text>
    <text x="0" y="28">Pump 1 GPM</text>
    <text id="val_t2_was1_flow" x="200" y="28" font-weight="600" fill="#6f42c1">—</text>
    <text x="0" y="52">Pump 2 GPM</text>
    <text id="val_t2_was2_flow" x="200" y="52" font-weight="600" fill="#6f42c1">—</text>
    <circle id="lamp_was_pump_alm" cx="8" cy="80" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="26" y="85">WAS pump alarm</text>
  </g>

  <!-- Shared blowers -->
  <g transform="translate(640, 568)" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#0f172a">Shared plant blowers</text>
    <text x="0" y="20" font-size="12" fill="#64748b">Aerobic centrifugal</text>
    <circle id="lamp_aer_cent1_run" cx="8" cy="36" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="24" y="41">1</text>
    <circle id="lamp_aer_cent2_run" cx="48" cy="36" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="64" y="41">2</text>
    <circle id="lamp_aer_cent3_run" cx="88" cy="36" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="104" y="41">3</text>
    <text x="0" y="64" font-size="12" fill="#64748b">Anoxic PD</text>
    <circle id="lamp_anox_pd1_run" cx="8" cy="80" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="24" y="85">1</text>
    <circle id="lamp_anox_pd2_run" cx="48" cy="80" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="64" y="85">2</text>
    <circle id="lamp_anox_pd3_run" cx="88" cy="80" r="11" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="104" y="85">3</text>
    <circle id="lamp_aer_blow_alm" cx="8" cy="112" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="26" y="117">Aerobic blower alm</text>
    <circle id="lamp_anox_blow_alm" cx="8" cy="140" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="26" y="145">Anoxic blower alm</text>
    <circle id="lamp_t2_alm" cx="8" cy="168" r="14" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <text x="28" y="173" font-size="14">Tank alarm</text>
  </g>
</svg>
